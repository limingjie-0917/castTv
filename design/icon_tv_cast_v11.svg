<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1024" height="1024" rx="220" fill="#000000"/>

  <!-- Centered TV symbol group -->
  <g id="tv-symbol">
    <!-- TV frame, horizontally centered -->
    <rect x="132" y="152" width="760" height="500" rx="78" stroke="#FFFFFF" stroke-width="40"/>

    <!-- Centered TV text -->
    <path d="M326 342H458" stroke="#FFFFFF" stroke-width="48" stroke-linecap="round"/>
    <path d="M392 342V510" stroke="#FFFFFF" stroke-width="48" stroke-linecap="round"/>
    <path d="M514 342L578 510L642 342" stroke="#FFFFFF" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Hollow triangular TV stand: top vertex just touches the TV frame bottom edge -->
    <path d="M512 672L388 804H636L512 672Z" stroke="#FFFFFF" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Phone in front of TV, bottom aligned with the TV symbol bottom -->
  <rect x="700" y="500" width="170" height="304" rx="34" fill="#000000"/>
  <rect x="700" y="500" width="170" height="304" rx="34" stroke="#FFFFFF" stroke-width="30"/>
  <circle cx="785" cy="766" r="10" fill="#FFFFFF"/>
  <circle cx="784" cy="535" r="7" fill="#FFFFFF"/>
</svg>
