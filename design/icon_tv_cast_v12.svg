<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1024" height="1024" rx="220" fill="#000000"/>

  <!-- Centered TV symbol group, shifted slightly downward for visual vertical balance -->
  <g id="tv-symbol">
    <!-- TV frame, horizontally centered -->
    <rect x="132" y="184" width="760" height="500" rx="78" stroke="#FFFFFF" stroke-width="40"/>

    <!-- Centered TV text -->
    <path d="M326 374H458" stroke="#FFFFFF" stroke-width="48" stroke-linecap="round"/>
    <path d="M392 374V542" stroke="#FFFFFF" stroke-width="48" stroke-linecap="round"/>
    <path d="M514 374L578 542L642 374" stroke="#FFFFFF" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Hollow triangular TV stand: top vertex just touches the TV frame bottom edge -->
    <path d="M512 704L388 836H636L512 704Z" stroke="#FFFFFF" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Phone in front of TV, shifted down together and bottom aligned with the TV symbol bottom -->
  <rect x="700" y="532" width="170" height="304" rx="34" fill="#000000"/>
  <rect x="700" y="532" width="170" height="304" rx="34" stroke="#FFFFFF" stroke-width="30"/>
  <circle cx="785" cy="798" r="10" fill="#FFFFFF"/>
  <circle cx="784" cy="567" r="7" fill="#FFFFFF"/>
</svg>
