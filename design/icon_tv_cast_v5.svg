<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="124" y1="120" x2="896" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6AA8FF"/>
      <stop offset="0.42" stop-color="#7C72FF"/>
      <stop offset="1" stop-color="#B14DFF"/>
    </linearGradient>
    <linearGradient id="bgWarm" x1="234" y1="720" x2="868" y2="322" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF7B54" stop-opacity="0.90"/>
      <stop offset="1" stop-color="#FFB35C" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="card" x1="190" y1="170" x2="826" y2="822" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="glass" x1="240" y1="210" x2="792" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="shadow" x="120" y="120" width="784" height="784" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#38206A" flood-opacity="0.24"/>
    </filter>
    <filter id="innerGlow" x="180" y="170" width="700" height="700" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- HyperOS/MIUI-like rounded gradient tile -->
  <rect x="80" y="80" width="864" height="864" rx="220" fill="url(#bg)"/>
  <rect x="80" y="80" width="864" height="864" rx="220" fill="url(#bgWarm)"/>

  <!-- soft glossy tile surface -->
  <g filter="url(#shadow)">
    <rect x="148" y="148" width="728" height="728" rx="184" fill="url(#card)"/>
    <rect x="164" y="164" width="696" height="696" rx="170" stroke="white" stroke-opacity="0.24" stroke-width="2"/>
  </g>

  <path d="M220 188C312 142 414 122 532 122C694 122 808 170 860 260" stroke="white" stroke-opacity="0.18" stroke-width="20" stroke-linecap="round"/>
  <ellipse cx="736" cy="250" rx="116" ry="72" fill="white" fill-opacity="0.10"/>

  <!-- TV main subject -->
  <g>
    <rect x="182" y="226" width="586" height="404" rx="72" fill="white" fill-opacity="0.94"/>
    <rect x="214" y="258" width="522" height="340" rx="48" fill="url(#glass)"/>
    <rect x="242" y="286" width="252" height="20" rx="10" fill="#FFFFFF" fill-opacity="0.42"/>
    <rect x="250" y="324" width="172" height="112" rx="28" fill="#FFFFFF" fill-opacity="0.12"/>
    <path d="M390 666C416 634 449 618 486 618C523 618 556 634 582 666" stroke="white" stroke-width="28" stroke-linecap="round" stroke-opacity="0.96"/>
    <rect x="338" y="684" width="296" height="36" rx="18" fill="white" fill-opacity="0.94"/>
  </g>

  <!-- Cast wave / arrow -->
  <g opacity="0.98">
    <path d="M528 524C572 506 612 506 652 518" stroke="#FFFFFF" stroke-opacity="0.72" stroke-width="18" stroke-linecap="round"/>
    <path d="M518 482C580 452 646 450 708 476" stroke="#FFFFFF" stroke-opacity="0.46" stroke-width="14" stroke-linecap="round"/>
    <path d="M504 442C589 404 683 403 764 442" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="11" stroke-linecap="round"/>
    <path d="M548 560H696" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round"/>
    <path d="M666 524L746 560L666 596" fill="#FFFFFF"/>
    <circle cx="524" cy="560" r="18" fill="#FFFFFF"/>
  </g>

  <!-- Phone in front, smaller than TV, bottom aligned -->
  <g>
    <rect x="610" y="434" width="208" height="286" rx="44" fill="#FFFFFF" fill-opacity="0.97"/>
    <rect x="628" y="452" width="172" height="250" rx="30" fill="#FFFFFF" fill-opacity="0.20"/>
    <rect x="642" y="468" width="144" height="218" rx="22" fill="#FFFFFF" fill-opacity="0.16"/>
    <rect x="684" y="460" width="60" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.70"/>
    <circle cx="714" cy="694" r="9" fill="#FFFFFF" fill-opacity="0.74"/>
  </g>

  <!-- overlap ambient shadow / depth cue -->
  <g filter="url(#innerGlow)">
    <ellipse cx="648" cy="606" rx="114" ry="44" fill="#5F2DCA" fill-opacity="0.16"/>
  </g>

  <!-- tiny polished dots -->
  <circle cx="230" cy="214" r="10" fill="#FFFFFF" fill-opacity="0.84"/>
  <circle cx="258" cy="198" r="6" fill="#FFFFFF" fill-opacity="0.72"/>
  <circle cx="286" cy="214" r="4" fill="#FFFFFF" fill-opacity="0.66"/>
</svg>
