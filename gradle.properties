# Project-wide Gradle settings.
# =============================================================
#  CPU / 内存 基线：4 逻辑核 · 16GB 内存 · 单 module (:app)
#  调优目标：避免「每次构建 CPU 超负荷」，在 4 核机器上把并发压到可呼吸的范围。
#  若在 8 核/32GB 以上机器上跑，可上调 workers.max → 4、Xmx → 6g、idleTimeout → 4h。
# =============================================================

# ----------- JVM（Gradle Daemon） -----------
# Xmx 2g：单 module 项目足够，避免启动时一次性 commit 大堆导致 CPU/内存峰值。
# 去掉 AlwaysPreTouch：该参数会在 daemon 启动瞬间预触全部堆内存页，是打包时 CPU 拉满的元凶；
#   单 module 增量构建 page fault 影响可忽略，不值得用启动峰值换取。
# 去掉 UseStringDeduplication：CPU 开销高于内存收益，16GB 机器无需此优化。
# UseG1GC 为 JDK17 默认，显式写出 + 暂停目标 200ms，降低 UI 可感知卡顿。
# Kotlin daemon 512m：单 module 编译元数据量小，1g 浪费。
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options=-Xmx512m,-XX:MaxMetaspaceSize=256m,-XX:+UseG1GC

# ----------- 并行 / 并发（4 核机器保守收敛） -----------
# 单 module 仓库：org.gradle.parallel 对调度无实际收益，反而引入线程启动/上下文切换开销，关闭。
org.gradle.parallel=false
# Kotlin/DEX/R8/AAPT2 worker 并发最大 2（留出 1 核给 Gradle 主线程 + 1 核给 IDE/Finder/输入法，避免风扇拉满）。
org.gradle.workers.max=2

# ----------- 复用 / 缓存（核心降 CPU 手段） -----------
# daemon 常驻：JIT 在 3~5 轮后达到稳态，后续增量构建 CPU 峰值可下降 40~60%。
# 严禁再在命令里加 --no-daemon。
org.gradle.daemon=true
# 4 小时空闲再销毁（一天正常迭代可复用同一只 daemon）。
org.gradle.daemon.idletimeout=14400000
# 构建缓存：本地增量编译已足够快，开启后曾导致源码修改未编译进 APK（cache hit 跳过 compileKotlin）。
# 关闭以确保每次构建都走真实增量编译，仅靠 daemon + Kotlin incremental 降 CPU。
org.gradle.caching=false
# 配置缓存：当前 bumpVersion 在执行期写 build.gradle.kts + 自定义 assembleDebug/exportApk 任务读 `project` 引用，
# 在 AGP 8.9/Gradle 8.9 组合下已知存在 16 条不兼容问题导致存储失败（见
# build/reports/configuration-cache/*/*.html），保留问题级别输出以便未来 AGP 修复后开启，
# 目前默认关闭（避免每次都显示「discarded with 16 problems」的构建失败噪音）。
org.gradle.configuration-cache=false
org.gradle.configuration-cache.problems=warn

# ----------- Android 插件侧 -----------
android.useAndroidX=true
android.nonTransitiveRClass=true
# Android Gradle Plugin：构建期使用同一个 Kotlin daemon + 复用 dex archives + 开启 non-final R（与 nonTransitiveRClass 配对收益）。
android.enableJetifier=false

# Kotlin code style
kotlin.code.style=official
# Kotlin 2.x 增量编译：对 classpath 变化更宽容，减少不必要的全量 recompile。
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
