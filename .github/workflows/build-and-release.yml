name: Build & Release APK

on:
  push:
    branches: [ main, master ]
    # 跳过纯文档/清理类推送 —— 与 build.yml 同步避免浪费 runner
    paths-ignore:
      - '**/*.md'
      - 'design/**'
      - 'docs/**'
      - 'tmp/**'
      - 'node_modules/**'
      - 'builds/**'
      - 'preview_card_layout.png'
      - 'review_report.xml'
      - '**/*.idsig'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

env:
  JAVA_VERSION: 17
  JAVA_DISTRO: 'temurin'
  ANDROID_COMPILE_SDK: '34'
  ANDROID_BUILD_TOOLS: '34.0.0'
  GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx4608m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" -Dorg.gradle.daemon=false'

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRO }}

      - name: Setup Gradle wrapper cache (gradle-actions v5)
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-write-only: ${{ github.ref == 'refs/heads/main' }}
          validate-wrappers: true
          add-job-summary: always

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools build-tools;${{ env.ANDROID_BUILD_TOOLS }} platforms;android-${{ env.ANDROID_COMPILE_SDK }}"

      - name: Ensure Gradle wrapper exists + grant execute permission
        shell: bash
        run: |
          set -e
          if [ ! -x ./gradlew ]; then
            # ponytail: git 没保留执行位或文件缺失时兜底：chmod 不幂等问题兼容
            if [ -f ./gradlew ]; then
              chmod +x ./gradlew
            elif command -v gradle >/dev/null 2>&1; then
              gradle wrapper --gradle-version 8.9 --distribution-type all
              chmod +x ./gradlew
            else
              echo "ERROR: gradlew 不存在且系统中没有 gradle，无法生成 wrapper" >&2
              ls -la
              exit 1
            fi
          fi
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "ERROR: gradle/wrapper/gradle-wrapper.jar 缺失，请先本地执行 gradle wrapper 并提交" >&2
            exit 1
          fi
          chmod +x ./gradlew
          echo "Gradle wrapper ready (ANDROID_HOME=$ANDROID_HOME, JAVA_HOME=$JAVA_HOME):"
          ls -la gradlew gradle/wrapper/

      - name: Create local.properties + accept SDK licenses
        shell: bash
        run: |
          set -e
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "sdk.dir=$sdk_root" > local.properties
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "--- local.properties ---"
          cat local.properties

      - name: Build release APK
        id: gradleBuild
        shell: bash
        continue-on-error: true
        env:
          CI: true
          GITHUB_ACTIONS: true
        run: |
          set -o pipefail
          rm -rf build-logs; mkdir -p build-logs
          ./gradlew assembleRelease -x lint --no-daemon --stacktrace --info \
            2> >(tee build-logs/gradle-stderr.log >&2) \
            1> >(tee build-logs/gradle-stdout.log)
          rc=${PIPESTATUS[0]}
          echo "====== STDERR LAST 200 ======"; tail -n 200 build-logs/gradle-stderr.log || true
          echo "====== STDOUT LAST 200 ======"; tail -n 200 build-logs/gradle-stdout.log || true
          exit $rc

      - name: Upload Release build logs as artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-logs-release-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: build-logs/
          retention-days: 14
          if-no-files-found: ignore

      - name: Read release APK & version
        id: apk
        if: steps.gradleBuild.outcome == 'success'
        shell: bash
        run: |
          set -e
          APK=$(find app/build/outputs/apk/release builds -maxdepth 4 -type f -name "casttv-receiver-v*-release.apk" 2>/dev/null | head -1)
          APK=${APK:-$(find . -maxdepth 2 -type f -name "casttv-receiver-v*.apk" ! -name "*-debug.apk" ! -name "*-gitee-sync.apk" 2>/dev/null | head -1)}
          if [ -z "$APK" ]; then
            echo "No release APK found" >&2
            ls -la app/build/outputs/apk/release/ 2>&1 || true
            ls -la builds/*/ 2>&1 || true
            ls -la casttv-receiver-v*.apk 2>&1 || true
            exit 1
          fi
          NAME=$(basename "$APK")
          SIZE=$(du -h "$APK" | cut -f1)
          VERSION=$(echo "$NAME" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          [ -z "$VERSION" ] && VERSION=$(grep -oE 'versionName\s*=\s*"[^"]+"' app/build.gradle.kts | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          SHA=$(git rev-parse --short HEAD)
          {
            echo "apk=$APK"
            echo "name=$NAME"
            echo "size=$SIZE"
            echo "version=$VERSION"
            echo "sha=$SHA"
          } >> "$GITHUB_OUTPUT"
          echo "VERSION: $VERSION  SHA: $SHA  FILE: $NAME($SIZE)  PATH: $APK"

      - name: Upload APK to Gitee Releases + update version.json
        if: steps.gradleBuild.outcome == 'success' && env.GITEE_TOKEN != ''
        continue-on-error: true
        shell: bash
        run: ./gradlew syncReleaseToGitee --no-daemon --stacktrace
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}

      - name: Upload APK artifact
        if: steps.gradleBuild.outcome == 'success'
        uses: actions/upload-artifact@v5
        with:
          name: release-apk-v${{ steps.apk.outputs.version }}-${{ steps.apk.outputs.sha }}
          path: |
            casttv-receiver-v*.apk
            builds/*/casttv-receiver-v*-release.apk
            app/build/outputs/apk/release/*.apk
          retention-days: 90
          compression-level: 6
          if-no-files-found: error

      - name: Final status gate
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.gradleBuild.outcome }}" != "success" ]; then
            echo "assembleRelease 失败：steps.gradleBuild.outcome=${{ steps.gradleBuild.outcome }}" >&2
            echo "👉 下载 Artifacts 卡片的 build-logs-release-run-${{ github.run_id }}-${{ github.run_attempt }}.zip 看 --info 级日志" >&2
            exit 1
          fi
          echo "Release 构建完成 ✅"
