name: Build & Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK to Gitee Releases + update version.json
        run: ./gradlew syncReleaseToGitee --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: casttv-receiver-apk
          path: |
            casttv-receiver-v*.apk
            app/build/outputs/apk/release/app-release.apk
          retention-days: 30
