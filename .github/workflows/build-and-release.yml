name: Build & Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  JAVA_VERSION: 17
  JAVA_DISTRO: 'temurin'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRO }}
          cache: 'gradle'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
        continue-on-error: true

      - name: Ensure Gradle wrapper exists + grant execute permission
        shell: bash
        run: |
          set -e
          if [ ! -x ./gradlew ]; then
            # ponytail: git 没保留执行位或文件缺失时兜底：chmod 不幂等问题兼容
            if [ -f ./gradlew ]; then
              chmod +x ./gradlew
            elif command -v gradle >/dev/null 2>&1; then
              gradle wrapper --gradle-version 8.9 --distribution-type all
              chmod +x ./gradlew
            else
              echo "ERROR: gradlew 不存在且系统中没有 gradle，无法生成 wrapper" >&2
              ls -la
              exit 1
            fi
          fi
          # Gradle wrapper jar 校验：缺失则报错
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "ERROR: gradle/wrapper/gradle-wrapper.jar 缺失，请先本地执行 gradle wrapper 并提交" >&2
            exit 1
          fi
          echo "Gradle wrapper ready:"
          ls -la gradlew gradle/wrapper/

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Create local.properties + accept SDK licenses
        shell: bash
        run: |
          set -e
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          # assembleRelease 必须接受 SDK 许可，否则 AGP 会弹窗中断
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          echo "local.properties:"
          cat local.properties

      - name: Build release APK
        shell: bash
        run: ./gradlew assembleRelease -x lint --no-daemon --stacktrace
        env:
          JAVA_TOOL_OPTIONS: '-Xmx4096m -Dfile.encoding=UTF-8'
          GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError"'
          # 明确标记 CI 环境，bumpVersion 不写回 build.gradle.kts 字面量
          CI: true

      - name: Read release APK & version
        id: apk
        shell: bash
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null || ls builds/*/casttv-receiver-*-release.apk 2>/dev/null || ls casttv-receiver-v*.apk 2>/dev/null | head -1)
          [ -z "$APK" ] && { echo "No release APK found"; ls -la app/build/outputs/apk/release/ 2>/dev/null; ls builds/*/ 2>/dev/null; exit 1; }
          NAME=$(basename "$APK")
          SIZE=$(du -h "$APK" | cut -f1)
          VERSION=$(grep -oE 'versionName\s*=\s*"[^"]+"' app/build.gradle.kts | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          SHA=$(git rev-parse --short HEAD)
          echo "apk=$APK" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "size=$SIZE" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "sha=$SHA"  >> $GITHUB_OUTPUT
          echo "VERSION: $VERSION  SHA: $SHA  FILE: $NAME($SIZE)"

      - name: Upload APK to Gitee Releases + update version.json
        if: env.GITEE_TOKEN != ''
        shell: bash
        run: ./gradlew syncReleaseToGitee --no-daemon --stacktrace || echo "syncReleaseToGitee skipped (需要 GITEE_TOKEN secret 或检查 version.json 是否存在)"
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-v${{ steps.apk.outputs.version }}-${{ steps.apk.outputs.sha }}
          path: |
            casttv-receiver-v*.apk
            builds/*/casttv-receiver-v*-release.apk
            app/build/outputs/apk/release/*.apk
          retention-days: 90
          compression-level: 6
          if-no-files-found: error
