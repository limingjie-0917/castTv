name: Build & Release APK

on:
  push:
    branches: [ main, master ]
    # 跳过纯文档/清理类推送 —— 与 build.yml 同步避免浪费 runner
    paths-ignore:
      - '**/*.md'
      - 'design/**'
      - 'docs/**'
      - 'tmp/**'
      - 'node_modules/**'
      - 'builds/**'
      - 'preview_card_layout.png'
      - 'review_report.xml'
      - '**/*.idsig'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

env:
  JAVA_VERSION: 17
  JAVA_DISTRO: 'temurin'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRO }}
          cache: 'gradle'

      - name: Setup Android SDK (API 34 + BuildTools 34)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5
        continue-on-error: true

      - name: Ensure Gradle wrapper exists + grant execute permission
        shell: bash
        run: |
          set -e
          if [ ! -x ./gradlew ]; then
            # ponytail: git 没保留执行位或文件缺失时兜底：chmod 不幂等问题兼容
            if [ -f ./gradlew ]; then
              chmod +x ./gradlew
            elif command -v gradle >/dev/null 2>&1; then
              gradle wrapper --gradle-version 8.9 --distribution-type all
              chmod +x ./gradlew
            else
              echo "ERROR: gradlew 不存在且系统中没有 gradle，无法生成 wrapper" >&2
              ls -la
              exit 1
            fi
          fi
          # Gradle wrapper jar 校验：缺失则报错
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "ERROR: gradle/wrapper/gradle-wrapper.jar 缺失，请先本地执行 gradle wrapper 并提交" >&2
            exit 1
          fi
          echo "Gradle wrapper ready:"
          ls -la gradlew gradle/wrapper/

      - name: Create local.properties + accept SDK licenses
        shell: bash
        run: |
          set -e
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          # assembleRelease 必须接受 SDK 许可，否则 AGP 会弹窗中断
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "--- local.properties ---"
          cat local.properties

      - name: Build release APK
        shell: bash
        run: ./gradlew assembleRelease -x lint --no-daemon --stacktrace
        env:
          JAVA_TOOL_OPTIONS: '-Xmx4096m -Dfile.encoding=UTF-8'
          GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError"'
          # 明确标记 CI 环境，bumpVersion 不写回 build.gradle.kts 字面量
          CI: true
          GITHUB_ACTIONS: true

      - name: Read release APK & version
        id: apk
        if: success()
        shell: bash
        run: |
          set -e
          APK=$(find app/build/outputs/apk/release builds -maxdepth 4 -name "casttv-receiver-v*-release.apk" 2>/dev/null | head -1)
          APK=${APK:-$(find . -maxdepth 2 -name "casttv-receiver-v*.apk" ! -name "*-debug.apk" ! -name "*-gitee-sync.apk" 2>/dev/null | head -1)}
          if [ -z "$APK" ]; then
            echo "No release APK found" >&2
            echo "--- app/build/outputs/apk/release ---" >&2; ls -la app/build/outputs/apk/release/ 2>&1 || true
            echo "--- builds/*/ ---" >&2; ls -la builds/*/ 2>&1 || true
            echo "--- root ---" >&2; ls -la casttv-receiver-v*.apk 2>&1 || true
            exit 1
          fi
          NAME=$(basename "$APK")
          SIZE=$(du -h "$APK" | cut -f1)
          VERSION=$(echo "$NAME" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          [ -z "$VERSION" ] && VERSION=$(grep -oE 'versionName\s*=\s*"[^"]+"' app/build.gradle.kts | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          SHA=$(git rev-parse --short HEAD)
          echo "apk=$APK" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "size=$SIZE" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "sha=$SHA"  >> $GITHUB_OUTPUT
          echo "VERSION: $VERSION  SHA: $SHA  FILE: $NAME($SIZE)  PATH: $APK"

      - name: Upload APK to Gitee Releases + update version.json
        id: gitee
        if: success() && env.GITEE_TOKEN != ''
        continue-on-error: true
        shell: bash
        run: ./gradlew syncReleaseToGitee --no-daemon --stacktrace
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: release-apk-v${{ steps.apk.outputs.version }}-${{ steps.apk.outputs.sha }}
          path: |
            casttv-receiver-v*.apk
            builds/*/casttv-receiver-v*-release.apk
            app/build/outputs/apk/release/*.apk
          retention-days: 90
          compression-level: 6
          if-no-files-found: error
