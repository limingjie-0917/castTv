name: Build CastTV Receiver

on:
  # —— 推送触发（主线 / 动画城/Taste 子分支）—— 只要 push 到这些分支就自动构建
  push:
    branches: [ main, develop, feature/*, ui/* ]
    tags:
      - 'v*'
    # 只在「非文档/非设计资源/非清理类」改动时真正跑构建，节省时长
    paths-ignore:
      - '**/*.md'
      - 'design/**'
      - 'docs/**'
      - 'tmp/**'
      - 'node_modules/**'
      - 'builds/**'
      - 'preview_card_layout.png'
      - 'review_report.xml'
      - '**/*.idsig'
      - 'LICENSE'
      - '.gitignore'

  # —— 手动触发：仓库 Actions 页面可以点 "Run workflow" 选分支构建
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build variant (debug/release/both)'
        required: false
        default: 'both'
        type: choice
        options: [ debug, release, both ]

env:
  JAVA_VERSION: 17
  JAVA_DISTRO: 'temurin'
  ANDROID_COMPILE_SDK: '34'
  ANDROID_BUILD_TOOLS: '34.0.0'
  # Gradle 在 CI 里不要因为 daemon 被杀而挂
  GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx4608m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" -Dorg.gradle.daemon=false'

permissions:
  contents: write          # tag 发布时写 Release
  actions: read
  packages: write

# 失败的 run 不用等超时，新 push 进来立刻取消上个同名 run
concurrency:
  group: build-casttv-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================
  # JOB 1 / 2 · assembleDebug：所有非 tag 推送都跑
  # ===========================================================
  assemble-debug:
    name: Build Debug APK
    if: ${{ !startsWith(github.ref, 'refs/tags/') && (github.event_name == 'workflow_dispatch' && github.event.inputs.variant != 'release') || (github.event_name != 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      # ===== 一次性搞定 JDK + Gradle wrapper + 缓存（官方组合，比手写稳）=====
      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRO }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle wrapper cache (gradle-actions v5)
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-write-only: ${{ github.ref == 'refs/heads/main' }}
          validate-wrappers: true
          add-job-summary: always

      - name: Setup Android SDK (API 34 + BuildTools 34)
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools build-tools;${{ env.ANDROID_BUILD_TOOLS }} platforms;android-${{ env.ANDROID_COMPILE_SDK }}"

      # 兜底：gradlew 执行位 + wrapper.jar 存在（setup-gradle 已包含但幂等安全）
      - name: Ensure Gradle wrapper ready
        shell: bash
        run: |
          set -e
          if [ ! -x ./gradlew ]; then
            if [ -f ./gradlew ]; then chmod +x ./gradlew
            elif command -v gradle >/dev/null 2>&1; then
              gradle wrapper --gradle-version 8.9 --distribution-type all
              chmod +x ./gradlew
            else
              echo "ERROR: gradlew 不存在且系统中没有 gradle，无法生成 wrapper" >&2
              ls -la; exit 1
            fi
          fi
          [ -f gradle/wrapper/gradle-wrapper.jar ] || { echo "ERROR: gradle/wrapper/gradle-wrapper.jar 缺失" >&2; exit 1; }
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          echo "===gradlew sanitize==="
          chmod +x ./gradlew
          ls -la gradlew gradle/wrapper/

      - name: Write local.properties + accept SDK licenses
        shell: bash
        run: |
          set -e
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "sdk.dir=$sdk_root" > local.properties
          echo "cmake.dir=/opt/android-sdk/cmake" >> local.properties || true
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          echo "--- local.properties ---"
          cat local.properties
          echo "--- sdk dir ---"
          ls "$sdk_root/platforms/android-${{ env.ANDROID_COMPILE_SDK }}/" 2>&1 | head -n 5 || true
          ls "$sdk_root/build-tools/${{ env.ANDROID_BUILD_TOOLS }}/" 2>&1 | head -n 5 || true

      - name: Gradle Diagnose (wrapper download + tasks)
        shell: bash
        run: |
          set -o pipefail
          rm -rf build-diagnostics; mkdir -p build-diagnostics
          ./gradlew --version 2>&1 | tee build-diagnostics/00-gradle-version.txt
          ./gradlew help --no-daemon 2>&1 | tail -n 200 | tee build-diagnostics/01-gradle-help.txt

      - name: Gradle assembleDebug (INFO 级日志 → 保存为 Artifact)
        id: gradleBuild
        shell: bash
        continue-on-error: true    # 失败也往下跑，把日志上传 Artifacts
        env:
          CI: true
          GITHUB_ACTIONS: true
        run: |
          set -o pipefail
          rm -rf build-logs; mkdir -p build-logs
          ./gradlew assembleDebug -x lint --no-daemon --stacktrace --info \
            2> >(tee build-logs/gradle-stderr.log >&2) \
            1> >(tee build-logs/gradle-stdout.log)
          rc=${PIPESTATUS[0]}
          # 也把 tail 留在 step 日志里，便于缩略查看
          echo "====== STDERR LAST 200 ======"
          tail -n 200 build-logs/gradle-stderr.log || true
          echo "====== STDOUT LAST 200 ======"
          tail -n 200 build-logs/gradle-stdout.log || true
          echo "EXIT_CODE=$rc" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: Upload Gradle build logs as artifact (失败也上传)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-logs-debug-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build-logs/
            build-diagnostics/
          retention-days: 14
          compression-level: 6
          if-no-files-found: ignore

      - name: Read APK path & version
        id: apk
        if: steps.gradleBuild.outcome == 'success'
        shell: bash
        run: |
          set -e
          APK=$(find app/build/outputs/apk/debug builds -maxdepth 4 -type f -name "casttv-receiver-v*-debug.apk" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "APK not found" >&2
            echo "--- candidate dirs ---" >&2
            ls -la app/build/outputs/apk/debug/ 2>&1 || true
            ls -la builds 2>&1 || true
            exit 1
          fi
          NAME=$(basename "$APK")
          SIZE=$(du -h "$APK" | cut -f1)
          VERSION=$(echo "$NAME" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          [ -z "$VERSION" ] && VERSION=$(grep -oE 'versionName\s*=\s*"[^"]+"' app/build.gradle.kts | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          SHA=$(git rev-parse --short HEAD)
          {
            echo "apk=$APK"; echo "name=$NAME"; echo "size=$SIZE"
            echo "version=$VERSION"; echo "sha=$SHA"
          } >> "$GITHUB_OUTPUT"
          echo "VERSION: $VERSION  SHA: $SHA  FILE: $NAME($SIZE)  PATH: $APK"

      - name: Upload Debug APK artifact
        if: steps.gradleBuild.outcome == 'success'
        uses: actions/upload-artifact@v5
        with:
          name: debug-apk-v${{ steps.apk.outputs.version }}-${{ steps.apk.outputs.sha }}
          path: ${{ steps.apk.outputs.apk }}
          retention-days: 30
          compression-level: 6

      - name: Final status gate (把 continue-on-error 再收敛成 job 失败，避免绿灯错觉)
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.gradleBuild.outcome }}" != "success" ]; then
            echo "Gradle assembleDebug 失败：steps.gradleBuild.outcome=${{ steps.gradleBuild.outcome }}" >&2
            echo "👉 下载 Artifacts 卡片的 build-logs-debug-run-${{ github.run_id }}-${{ github.run_attempt }}.zip 查看 --info 级日志定位" >&2
            exit 1
          fi
          echo "构建成功，Artifacts 卡片里已有 debug APK + logs（后者方便快速回溯）"

  # ===========================================================
  # JOB 2 / 2 · assembleRelease + GitHub Release：tag 推送或手动 release 模式
  # ===========================================================
  release-apk:
    name: Build Release APK & Draft GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.variant != 'debug')
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRO }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle wrapper cache (gradle-actions v5)
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-write-only: ${{ github.ref == 'refs/heads/main' }}
          validate-wrappers: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools build-tools;${{ env.ANDROID_BUILD_TOOLS }} platforms;android-${{ env.ANDROID_COMPILE_SDK }}"

      - name: Ensure Gradle wrapper ready
        shell: bash
        run: |
          set -e
          if [ ! -x ./gradlew ]; then
            if [ -f ./gradlew ]; then chmod +x ./gradlew
            elif command -v gradle >/dev/null 2>&1; then
              gradle wrapper --gradle-version 8.9 --distribution-type all; chmod +x ./gradlew
            else echo "ERROR: gradlew 不存在且系统中没有 gradle，无法生成 wrapper" >&2; ls -la; exit 1; fi
          fi
          [ -f gradle/wrapper/gradle-wrapper.jar ] || { echo "ERROR: gradle/wrapper/gradle-wrapper.jar 缺失" >&2; exit 1; }
          chmod +x ./gradlew
          echo "ANDROID_HOME=$ANDROID_HOME  JAVA_HOME=$JAVA_HOME"
          ls -la gradlew gradle/wrapper/

      - name: Write local.properties + accept SDK licenses
        shell: bash
        run: |
          set -e
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "sdk.dir=$sdk_root" > local.properties
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          echo "--- local.properties ---"; cat local.properties

      - name: Gradle assembleRelease
        id: gradleBuild
        shell: bash
        continue-on-error: true
        env:
          CI: true
          GITHUB_ACTIONS: true
        run: |
          set -o pipefail
          rm -rf build-logs; mkdir -p build-logs
          ./gradlew assembleRelease -x lint --no-daemon --stacktrace --info \
            2> >(tee build-logs/gradle-stderr.log >&2) \
            1> >(tee build-logs/gradle-stdout.log)
          rc=${PIPESTATUS[0]}
          echo "====== STDERR LAST 200 ======"; tail -n 200 build-logs/gradle-stderr.log || true
          echo "====== STDOUT LAST 200 ======"; tail -n 200 build-logs/gradle-stdout.log || true
          exit $rc

      - name: Upload Release build logs as artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-logs-release-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: build-logs/
          retention-days: 14
          if-no-files-found: ignore

      - name: Read release APK & version
        id: apk
        if: steps.gradleBuild.outcome == 'success'
        shell: bash
        run: |
          set -e
          APK=$(find app/build/outputs/apk/release builds -maxdepth 4 -type f -name "casttv-receiver-v*-release.apk" 2>/dev/null | head -1)
          APK=${APK:-$(find . -maxdepth 3 -type f -name "casttv-receiver-v*.apk" ! -name "*-debug.apk" ! -name "*-gitee-sync.apk" 2>/dev/null | head -1)}
          if [ -z "$APK" ]; then
            echo "No release APK found" >&2
            ls -la app/build/outputs/apk/release/ 2>&1 || true; ls -la builds/*/ 2>&1 || true; exit 1
          fi
          NAME=$(basename "$APK"); SIZE=$(du -h "$APK" | cut -f1)
          VERSION=$(echo "$NAME" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          [ -z "$VERSION" ] && VERSION=$(grep -oE 'versionName\s*=\s*"[^"]+"' app/build.gradle.kts | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          SHA=$(git rev-parse --short HEAD)
          { echo "apk=$APK"; echo "name=$NAME"; echo "size=$SIZE"
            echo "version=$VERSION"; echo "sha=$SHA" } >> "$GITHUB_OUTPUT"
          echo "VERSION: $VERSION  SHA: $SHA  FILE: $NAME($SIZE)  PATH: $APK"

      - name: Upload Release APK artifact
        if: steps.gradleBuild.outcome == 'success'
        uses: actions/upload-artifact@v5
        with:
          name: release-apk-v${{ steps.apk.outputs.version }}-${{ steps.apk.outputs.sha }}
          path: ${{ steps.apk.outputs.apk }}
          retention-days: 90

      - name: Upload APK to Gitee Releases + update version.json
        if: steps.gradleBuild.outcome == 'success' && env.GITEE_TOKEN != ''
        continue-on-error: true
        id: giteeSync
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: ./gradlew syncReleaseToGitee --no-daemon --stacktrace

      - name: Publish GitHub Release (仅 tag 推送时)
        if: startsWith(github.ref, 'refs/tags/v') && steps.gradleBuild.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          name: Release v${{ steps.apk.outputs.version }}
          tag_name: ${{ github.ref_name }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: ${{ steps.apk.outputs.apk }}
          body: |
            ## CastTV Receiver v${{ steps.apk.outputs.version }}

            | 项 | 值 |
            |---|---|
            | 版本 | ${{ steps.apk.outputs.version }} |
            | 提交 | \`${{ steps.apk.outputs.sha }}\` |
            | APK | ${{ steps.apk.outputs.name }} |
            | 体积 | ${{ steps.apk.outputs.size }} |
            | 签名 | casttv.keystore (debug/release 共用，直接覆盖安装) |

            ### 主要更新（自动生成）
            - 请进入 Release 编辑页填入本次发布说明。

            ### 安装
            1. 下载下方附件 APK
            2. 通过 `adb install -r <apk>` 或盒子文件管理器直接安装（同签名覆盖安装）

            🤖 自动由 GitHub Actions 构建 · 来源 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Final status gate
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.gradleBuild.outcome }}" != "success" ]; then
            echo "Gradle assembleRelease 失败（steps.gradleBuild.outcome=${{ steps.gradleBuild.outcome }}）" >&2
            echo "👉 下载 Artifacts 卡片的 build-logs-release-run-${{ github.run_id }}-${{ github.run_attempt }}.zip" >&2
            exit 1
          fi
          echo "Release 构建完成 ✅"
