name: Build CastTV Receiver

on:
  # —— 推送触发（主线 / 动画城/Taste 子分支）—— 只要 push 到这些分支就自动构建
  push:
    branches: [ main, develop, feature/*, ui/* ]
    tags:
      - 'v*'
    # 只在「非文档/非设计资源/非清理类」改动时真正跑构建，节省时长
    paths-ignore:
      - '**/*.md'
      - 'design/**'
      - 'docs/**'
      - 'tmp/**'
      - 'node_modules/**'
      - 'builds/**'
      - 'preview_card_layout.png'
      - 'review_report.xml'
      - '**/*.idsig'
      - 'LICENSE'
      - '.gitignore'

  # —— 手动触发：仓库 Actions 页面可以点 "Run workflow" 选分支构建（push 失败时手动重试）
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build variant (debug/release/both)'
        required: false
        default: 'both'
        type: choice
        options: [ debug, release, both ]

  # —— 其他触发方式（以后可按需开启）：
  # pull_request:  branches: [main]    # 有人发 PR 时先跑一遍 assembleDebug 守门
  # schedule:      - cron: '0 2 * * *' # 每天凌晨 2:00 UTC 跑一次 Release build 做健康检查

env:
  GRADLE_WRAPPER_VALIDATE: true
  JAVA_VERSION: 17
  JAVA_DISTRO: 'temurin'

# ——— 权限控制：读源码 + 写 artifacts + 写 Release（tag 发布）———
permissions:
  contents: write          # tag 发布时写 Release
  actions: read
  packages: write

jobs:
  # ===========================================================
  # JOB 1 / 2 · assembleDebug：所有分支都跑，保证改完即编
  # ===========================================================
  assemble-debug:
    name: Build Debug APK
    if: ${{ !startsWith(github.ref, 'refs/tags/') && (github.event_name == 'workflow_dispatch' && github.event.inputs.variant != 'release') || (github.event_name != 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0           # bumpVersion 读 git log 需要历史
          submodules: recursive

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRO }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'           # 自动缓存 ~/.gradle/caches, wrapper

      - name: Setup Android SDK (API 34 + BuildTools 34)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5
        continue-on-error: true

      - name: Ensure Gradle wrapper exists + grant execute permission
        shell: bash
        run: |
          set -e
          if [ ! -x ./gradlew ]; then
            # ponytail: git 没保留执行位或文件缺失时兜底：chmod 不幂等问题兼容
            if [ -f ./gradlew ]; then
              chmod +x ./gradlew
            elif command -v gradle >/dev/null 2>&1; then
              gradle wrapper --gradle-version 8.9 --distribution-type all
              chmod +x ./gradlew
            else
              echo "ERROR: gradlew 不存在且系统中没有 gradle，无法生成 wrapper" >&2
              ls -la
              exit 1
            fi
          fi
          [ -f gradle/wrapper/gradle-wrapper.jar ] || { echo "ERROR: gradle/wrapper/gradle-wrapper.jar 缺失" >&2; exit 1; }
          echo "Gradle wrapper ready:"
          ls -la gradlew gradle/wrapper/

      - name: Create local.properties + accept SDK licenses
        shell: bash
        run: |
          set -e
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "--- local.properties ---"
          cat local.properties

      - name: Gradle assembleDebug
        shell: bash
        run: ./gradlew assembleDebug -x lint --no-daemon --stacktrace
        env:
          JAVA_TOOL_OPTIONS: '-Xmx4096m -Dfile.encoding=UTF-8'
          GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError"'
          # CI 环境：bumpVersion 跳过写回 build.gradle.kts 字面量（避免污染工作树）
          CI: true
          GITHUB_ACTIONS: true

      - name: Read APK path & version
        id: apk
        if: success()
        shell: bash
        run: |
          set -e
          APK=$(find app/build/outputs/apk/debug builds -maxdepth 4 -name "casttv-receiver-v*-debug.apk" 2>/dev/null | head -1)
          [ -z "$APK" ] && { echo "APK not found in app/build/outputs/apk/debug or builds/" >&2; ls -la app/build/outputs/apk/debug/ 2>/dev/null || true; ls -la builds/*/ 2>/dev/null || true; exit 1; }
          NAME=$(basename "$APK")
          SIZE=$(du -h "$APK" | cut -f1)
          VERSION=$(echo "$NAME" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          [ -z "$VERSION" ] && VERSION=$(grep -oE 'versionName\s*=\s*"[^"]+"' app/build.gradle.kts | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          SHA=$(git rev-parse --short HEAD)
          echo "apk=$APK" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "size=$SIZE" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "sha=$SHA"  >> $GITHUB_OUTPUT
          echo "VERSION: $VERSION  SHA: $SHA  FILE: $NAME($SIZE)  PATH: $APK"

      - name: Upload Debug APK artifact
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: debug-apk-v${{ steps.apk.outputs.version }}-${{ steps.apk.outputs.sha }}
          path: ${{ steps.apk.outputs.apk }}
          retention-days: 30          # 调试包保留 30 天
          compression-level: 6

      - name: Job summary
        if: success()
        shell: bash
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<-EOF
          ## 构建成功 · Debug APK
          | 项 | 值 |
          |---|---|
          | 版本 | ${{ steps.apk.outputs.version }} |
          | 提交 | \`${{ steps.apk.outputs.sha }}\` |
          | APK 名 | ${{ steps.apk.outputs.name }} |
          | 体积 | ${{ steps.apk.outputs.size }} |
          | 触发 | ${{ github.event_name }}  · ${{ github.event.head_commit.message }} |

          👉 在 Actions 页顶部 Artifacts 卡片下载安装（同签名，可直接覆盖安装）。
          EOF

  # ===========================================================
  # JOB 2 / 2 · assembleRelease + GitHub Release：tag 推送时跑
  # ===========================================================
  release-apk:
    name: Build Release APK & Draft GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.variant != 'debug')
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRO }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Android SDK (API 34 + BuildTools 34)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5
        continue-on-error: true

      - name: Ensure Gradle wrapper exists + grant execute permission
        shell: bash
        run: |
          set -e
          if [ ! -x ./gradlew ]; then
            if [ -f ./gradlew ]; then
              chmod +x ./gradlew
            elif command -v gradle >/dev/null 2>&1; then
              gradle wrapper --gradle-version 8.9 --distribution-type all
              chmod +x ./gradlew
            else
              echo "ERROR: gradlew 不存在且系统中没有 gradle，无法生成 wrapper" >&2
              ls -la
              exit 1
            fi
          fi
          [ -f gradle/wrapper/gradle-wrapper.jar ] || { echo "ERROR: gradle/wrapper/gradle-wrapper.jar 缺失" >&2; exit 1; }
          echo "Gradle wrapper ready:"
          ls -la gradlew gradle/wrapper/

      - name: Create local.properties + accept SDK licenses
        shell: bash
        run: |
          set -e
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          echo "ANDROID_HOME=$ANDROID_HOME"
          cat local.properties

      - name: Gradle assembleRelease
        shell: bash
        run: ./gradlew assembleRelease -x lint --no-daemon --stacktrace
        env:
          JAVA_TOOL_OPTIONS: '-Xmx4096m -Dfile.encoding=UTF-8'
          GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError"'
          # 明确标记 CI 环境，bumpVersion 不写回 build.gradle.kts 字面量
          CI: true
          GITHUB_ACTIONS: true

      - name: Read release APK & version
        id: apk
        if: success()
        shell: bash
        run: |
          set -e
          APK=$(find app/build/outputs/apk/release builds -maxdepth 4 -name "casttv-receiver-v*-release.apk" 2>/dev/null | head -1)
          APK=${APK:-$(find . -maxdepth 3 -name "casttv-receiver-v*.apk" ! -name "*-debug.apk" ! -name "*-gitee-sync.apk" 2>/dev/null | head -1)}
          [ -z "$APK" ] && { echo "No release APK found" >&2; ls -la app/build/outputs/apk/release/ 2>/dev/null || true; ls -la builds/*/ 2>/dev/null || true; exit 1; }
          NAME=$(basename "$APK")
          SIZE=$(du -h "$APK" | cut -f1)
          VERSION=$(echo "$NAME" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          [ -z "$VERSION" ] && VERSION=$(grep -oE 'versionName\s*=\s*"[^"]+"' app/build.gradle.kts | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          SHA=$(git rev-parse --short HEAD)
          echo "apk=$APK" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "size=$SIZE" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "sha=$SHA"  >> $GITHUB_OUTPUT
          echo "VERSION: $VERSION  SHA: $SHA  FILE: $NAME($SIZE)  PATH: $APK"

      - name: Upload Release APK artifact
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: release-apk-v${{ steps.apk.outputs.version }}
          path: ${{ steps.apk.outputs.apk }}
          retention-days: 90

      - name: Publish GitHub Release (仅 tag 推送时)
        if: startsWith(github.ref, 'refs/tags/v') && success()
        uses: softprops/action-gh-release@v2
        with:
          name: Release v${{ steps.apk.outputs.version }}
          tag_name: ${{ github.ref_name }}
          draft: true                      # 先设成草稿，你到 Release 页改文案再发布
          prerelease: false
          fail_on_unmatched_files: true
          files: ${{ steps.apk.outputs.apk }}
          body: |
            ## CastTV Receiver v${{ steps.apk.outputs.version }}

            | 项 | 值 |
            |---|---|
            | 版本 | ${{ steps.apk.outputs.version }} |
            | 提交 | \`${{ steps.apk.outputs.sha }}\` |
            | APK | ${{ steps.apk.outputs.name }} |
            | 体积 | ${{ steps.apk.outputs.size }} |
            | 签名 | casttv.keystore (debug/release 共用，直接覆盖安装) |

            ### 主要更新（自动生成）
            - 请进入 Release 编辑页填入本次发布说明。

            ### 安装
            1. 下载下方附件 APK
            2. 通过 `adb install -r <apk>` 或盒子文件管理器直接安装（同签名覆盖安装）

            🤖 自动由 GitHub Actions 构建 · 来源 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release job summary
        if: success()
        shell: bash
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<-EOF
          ## Release 构建完成
          | 项 | 值 |
          |---|---|
          | 版本 | ${{ steps.apk.outputs.version }} |
          | 提交 | \`${{ steps.apk.outputs.sha }}\` |
          | APK | ${{ steps.apk.outputs.name }}（${{ steps.apk.outputs.size }}）|

          - 若本次由 tag 触发：Release 草稿已创建，请到 [Releases 页面](/${{ github.repository }}/releases) 编辑后点击 Publish。
          - 若由 workflow_dispatch 触发：产物只在 Actions Artifacts。
          EOF
